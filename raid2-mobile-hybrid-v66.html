<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">
  <title>RAID — Hello Mall</title>
  <style>
    html,body,#canvas{margin:0;padding:0;border:0;width:100%;height:100%;}
    body{color:white;background:#000;overflow:hidden;touch-action:none;}
    #canvas{display:block;outline:none;}
    #status{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#242424;}
    #status-progress{width:50%;}
    #status-notice{display:none;background:#5b3943;border:1px solid #9b3943;border-radius:.5rem;color:#e0e0e0;font:16px/1.3 Arial,sans-serif;margin:0 2rem;padding:1rem;text-align:center;}
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0"></canvas>
  <div id="status"><progress id="status-progress"></progress><div id="status-notice"></div></div>
  <script src="https://reddevilllll.github.io/Raid-web/raid2-mobile-v66.js"></script>
  <script>
    const GODOT_CONFIG = {args:[],canvasResizePolicy:2,emscriptenPoolSize:8,ensureCrossOriginIsolationHeaders:false,executable:"raid2-mobile-v66",experimentalVK:false,fileSizes:{"raid2-mobile-v66.pck":4863680,"raid2-mobile-v66.wasm":39514754},focusCanvas:true,gdextensionLibs:[],godotPoolSize:4};
    const GODOT_THREADS_ENABLED = false;
    const engine = new Engine(GODOT_CONFIG);
    const status = document.getElementById('status');
    const progress = document.getElementById('status-progress');
    const notice = document.getElementById('status-notice');
    const fail = (error) => { console.error(error); notice.textContent = error?.message || String(error); notice.style.display='block'; progress.style.display='none'; };
    engine.startGame({onProgress:(current,total)=>{ if(current>0&&total>0){progress.value=current;progress.max=total;} }}).then(()=>status.remove(),fail);
  </script>
</body>
</html>
