<!doctype html>
<meta charset="utf-8">
<title>RAID WebSocket probe</title>
<pre id="out">connecting…</pre>
<script>
const out = document.querySelector("#out");
const params = new URLSearchParams(location.search);
const url = params.get("ws");
const log = (line) => { out.textContent += "\n" + line; };
if (!url) {
  out.textContent = "missing ?ws=...";
} else {
  log(url);
  const socket = new WebSocket(url);
  socket.binaryType = "arraybuffer";
  socket.onopen = () => log("OPEN");
  socket.onmessage = (event) => log("MESSAGE " + (event.data.byteLength ?? event.data.length ?? 0));
  socket.onerror = () => log("ERROR");
  socket.onclose = (event) => log("CLOSE " + event.code + " " + event.reason);
}
</script>
